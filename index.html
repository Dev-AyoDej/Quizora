<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,lock,visibility,visibility_off" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <form id="login">
            
            <img src="logo.png" alt="logo">
            <p> Kindly enter your details </p>

            <div>
                <label for="name"> Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div id="passbox">
                <label for="password"> Access Key </label>
                <input type="password" id="password" placeholder="Enter Access key" required>
            

            <span class="material-symbols-outlined" id="eyeon">
                visibility
            </span>

            <span class="material-symbols-outlined" id="eyeoff">
                visibility_off
            </span>
            </div>

            <p id="msg"></p>

            <button type="submit">Login</button>
        </form>
        <article>
            <aside>
                <span class="material-symbols-outlined">
                    lock
                </span>
                <p>Enter correct key to gain access </p>
            </aside>
        </article>
    </div>

    <script src="main.js"></script>
</body>
</html>
